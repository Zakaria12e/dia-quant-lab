tickers:
  asset: DIA
  benchmark: SPY

download:
  start: "2018-01-01"
  end: "2026-10-31"

windows:
  train: ["2018-01-01", "2022-12-31"]
  validation: ["2023-01-01", "2024-12-31"]
  test: ["2025-01-01", "2026-10-30"]

seed: 42

target:
  kind: log_return_close_to_close
  horizon: 1

econometrics:
  max_p: 3
  max_q: 3
  seasonal_period: 5
  exog: spy_ret_lag1

risk:
  scale: 100
  alphas: [0.05, 0.01]          # VaR/ES 95 % et 99 %
  models:                        # grille comparée sur l'AIC d'apprentissage
    - {name: GARCH,     vol: GARCH,  p: 1, o: 0, q: 1}
    - {name: GJR-GARCH, vol: GARCH,  p: 1, o: 1, q: 1}
    - {name: EGARCH,    vol: EGARCH, p: 1, o: 1, q: 1}
  distributions: [normal, t, skewt]
  ewma_lambda: 0.94              # RiskMetrics (1996)
  hs_window: 250                 # simulation historique, 1 an de bourse
  rolling_window: 20
  capital: 100000
  es_n_sim: 5000                 # tirages Monte-Carlo du test ES d'Acerbi-Székely (seed globale)
  seuil_tests: 0.05              # seuil de rejet des tests de backtest (Kupiec, Christoffersen, Z2, DM, MZ)
